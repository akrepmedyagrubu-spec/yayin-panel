<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS PANEL PRO</title>

<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial;}
.container{display:flex;height:100vh;}
.sidebar{width:320px;background:#1a1a1a;padding:10px;}
#list div{padding:8px;background:#222;margin:5px;cursor:pointer;}
input,button{width:100%;padding:10px;margin:5px 0;background:#222;color:white;border:none;}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<h3>🎛 OBS PANEL</h3>

<input id="video" placeholder="video.mp4 veya url">
<button onclick="add()">➕ EKLE</button>

<button onclick="send()">🚀 YAYINA GÖNDER</button>

<div id="list"></div>
</div>

<div style="flex:1;background:black;">
<h3 style="padding:10px;">LIVE PREVIEW (dummy)</h3>
</div>

</div>

<script>

let playlist=[];

function render(){
  let l=document.getElementById("list");
  l.innerHTML="";
  playlist.forEach((v,i)=>{
    let d=document.createElement("div");
    d.innerText=v;
    d.onclick=()=>{playlist.splice(i,1);render();}
    l.appendChild(d);
  });
}

function add(){
  let v=document.getElementById("video").value;
  if(!v) return;
  playlist.push(v);
  render();
}

function send(){

fetch("akrepyayin.site.je/save.php", {
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({playlist})
});

alert("Yayın güncellendi");
}

</script>

</body>
</html>
