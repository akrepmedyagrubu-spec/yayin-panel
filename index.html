<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS PANEL</title>
<style>
body{background:#111;color:white;font-family:Arial;margin:0;padding:20px}
input,button{width:100%;padding:10px;margin:5px 0;background:#222;color:white;border:none}
.item{padding:8px;background:#222;margin:5px 0;cursor:pointer}
</style>
</head>

<body>

<h2>🎛 OBS PANEL</h2>

<input id="video" placeholder="video.mp4 veya url">
<button onclick="add()">EKLE</button>
<button onclick="send()">YAYINA GÖNDER</button>

<div id="list"></div>

<script>
let playlist=[];

function render(){
  let l=document.getElementById("list");
  l.innerHTML="";
  playlist.forEach((v,i)=>{
    let d=document.createElement("div");
    d.className="item";
    d.innerText=v;
    d.onclick=()=>{playlist.splice(i,1);render();}
    l.appendChild(d);
  });
}

function add(){
  let v=document.getElementById("video").value;
  playlist.push(v);
  render();
}

function send(){
  fetch("https://SENIN-SERVER/save.php",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playlist})
  });
  alert("gönderildi");
}
</script>

</body>
</html>
