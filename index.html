<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS PANEL</title>
<style>
body{background:#111;color:white;font-family:Arial;margin:0;padding:20px}
input,button{width:100%;padding:10px;margin:5px 0;background:#222;color:white;border:none}
.item{padding:8px;background:#222;margin:5px 0;cursor:pointer}
</style>
</head>

<body>

<h2>🎛 OBS PANEL</h2>

<h3>📤 Video Upload</h3>
<input type="file" id="file">
<button onclick="upload()">UPLOAD</button>

<hr>

<h3>🎥 Playlist</h3>
<input id="video" placeholder="video URL veya uploads/video.mp4">
<button onclick="add()">EKLE</button>

<button onclick="send()">YAYINA GÖNDER</button>

<div id="list"></div>

<script>

let playlist=[];

function render(){
  let l=document.getElementById("list");
  l.innerHTML="";
  playlist.forEach((v,i)=>{
    let d=document.createElement("div");
    d.className="item";
    d.innerText=v;
    d.onclick=()=>{playlist.splice(i,1);render();}
    l.appendChild(d);
  });
}

function add(){
  let v=document.getElementById("video").value;
  playlist.push(v);
  render();
}

function send(){
fetch("http://akrepyayin.site.je/save.php", {
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({playlist})
});
alert("Yayın güncellendi");
}

function upload(){
let file=document.getElementById("file").files[0];
let form=new FormData();
form.append("file",file);

fetch("http://akrepyayin.site.je/upload.php",{
method:"POST",
body:form
}).then(r=>r.text()).then(d=>{
alert("Yüklendi: uploads/"+file.name);
});
}

</script>

</body>
</html>
