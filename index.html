<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS PANEL PRO</title>

<style>
body{
margin:0;
background:#0b0b0b;
color:white;
font-family:Arial;
}

.top{
padding:15px;
background:#151515;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 50px);
}

.left{
width:320px;
background:#111;
padding:15px;
box-sizing:border-box;
}

.right{
flex:1;
padding:15px;
background:#0d0d0d;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
background:#222;
color:white;
border:none;
}

.item{
padding:8px;
background:#1c1c1c;
margin:5px 0;
cursor:pointer;
border-left:3px solid #00ff88;
}

#uploadBox{
margin-top:15px;
padding:10px;
background:#1a1a1a;
}

#progressBar{
width:100%;
height:18px;
background:#333;
margin-top:10px;
}

#progressFill{
height:100%;
width:0%;
background:#00ff88;
}
</style>
</head>

<body>

<div class="top">🎛 OBS PANEL PRO</div>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>📤 Upload Video</h3>
<input type="file" id="file">
<button onclick="upload()">UPLOAD</button>

<div id="uploadBox">
<div id="progressBar">
<div id="progressFill"></div>
</div>
<p id="status">Hazır</p>
</div>

<hr>

<h3>🎥 Playlist</h3>

<input id="video" placeholder="uploads/video.mp4">
<button onclick="add()">EKLE</button>
<button onclick="send()">YAYINA GÖNDER</button>

<div id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">
<h3>📺 Preview</h3>
<p>Stream preview sonra eklenecek</p>
</div>

</div>

<script>

let playlist=[];

function render(){
let l=document.getElementById("list");
l.innerHTML="";

playlist.forEach((v,i)=>{
let d=document.createElement("div");
d.className="item";
d.innerText=v;
d.onclick=()=>{playlist.splice(i,1);render();}
l.appendChild(d);
});
}

function add(){
let v=document.getElementById("video").value;
if(!v) return;
playlist.push(v);
render();
}

function send(){
fetch("https://akrepyayin.site.je/save.php",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({playlist})
});

alert("Yayın güncellendi");
}

/* ================= UPLOAD ================= */

function upload(){

let file=document.getElementById("file").files[0];
if(!file){
alert("Dosya seç");
return;
}

let form=new FormData();
form.append("file",file);

let xhr=new XMLHttpRequest();

xhr.open("POST","https://akrepyayin.site.je/upload.php",true);

xhr.upload.onprogress=function(e){
if(e.lengthComputable){
let p=(e.loaded/e.total)*100;
document.getElementById("progressFill").style.width=p+"%";
document.getElementById("status").innerText=Math.floor(p)+"%";
}
};

xhr.onload=function(){
console.log(xhr.responseText);

if(xhr.status>=200 && xhr.status<300){
document.getElementById("status").innerText="UPLOAD OK ✔";
}else{
document.getElementById("status").innerText="FAIL ❌";
}
};

xhr.onerror=function(){
document.getElementById("status").innerText="NETWORK ERROR ❌";
};

xhr.send(form);
}

</script>

</body>
</html>
