<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS PANEL PRO</title>

<style>
body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial;
}

/* TOP BAR */
.top{
padding:15px;
background:#151515;
font-size:18px;
font-weight:bold;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 50px);
}

/* LEFT */
.left{
width:320px;
background:#111;
padding:15px;
box-sizing:border-box;
}

/* RIGHT */
.right{
flex:1;
background:#0d0d0d;
padding:15px;
}

/* BUTTONS */
button,input{
width:100%;
padding:10px;
margin:5px 0;
background:#222;
color:white;
border:none;
}

/* ITEMS */
.item{
padding:10px;
background:#1c1c1c;
margin:5px 0;
cursor:pointer;
border-left:3px solid #00ff88;
}

/* PROGRESS SCREEN */
#uploadScreen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
}

.bar{
width:80%;
height:25px;
background:#333;
margin-top:20px;
border-radius:5px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff88;
transition:0.2s;
}

#status{
margin-top:10px;
color:#aaa;
}
</style>
</head>

<body>

<div class="top">🎛 OBS PANEL PRO</div>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>📤 Upload</h3>
<input type="file" id="file">
<button onclick="upload()">UPLOAD</button>

<hr>

<h3>🎥 Playlist</h3>

<input id="video" placeholder="uploads/video.mp4">
<button onclick="add()">EKLE</button>
<button onclick="send()">YAYINA GÖNDER</button>

<div id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">
<h3>📺 Preview (dummy)</h3>
<p>Buraya sonra stream preview eklenir</p>
</div>

</div>

<!-- UPLOAD SCREEN -->
<div id="uploadScreen">
<h2>📤 Uploading...</h2>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div id="status">0%</div>
</div>

<script>

let playlist=[];

function render(){
let l=document.getElementById("list");
l.innerHTML="";

playlist.forEach((v,i)=>{
let d=document.createElement("div");
d.className="item";
d.innerText=v;
d.onclick=()=>{playlist.splice(i,1);render();}
l.appendChild(d);
});
}

function add(){
let v=document.getElementById("video").value;
if(!v) return;
playlist.push(v);
render();
}

function send(){
fetch("http://akrepyayin.site.je/save.php",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({playlist})
});

alert("Yayın güncellendi");
}

/* UPLOAD SYSTEM */
function upload(){

let file=document.getElementById("file").files[0];
if(!file) return;

document.getElementById("uploadScreen").style.display="flex";

let form=new FormData();
form.append("file",file);

let xhr=new XMLHttpRequest();

xhr.open("POST","http://akrepyayin.site.je/upload.php");

xhr.upload.onprogress=function(e){
if(e.lengthComputable){
let p=Math.floor((e.loaded/e.total)*100);
document.getElementById("fill").style.width=p+"%";
document.getElementById("status").innerText=p+"%";
}
};

xhr.onload=function(){
document.getElementById("status").innerText="DONE ✔";
setTimeout(()=>{
document.getElementById("uploadScreen").style.display="none";
document.getElementById("fill").style.width="0%";
},800);
};

xhr.onerror=function(){
document.getElementById("status").innerText="ERROR ❌";
};

xhr.send(form);
}

</script>

</body>
</html>
